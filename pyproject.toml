[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waveshare-mqtt"
version = "0.1.0"
description = "MQTT bridge for a Waveshare Modbus RTU 8-channel relay module"
requires-python = ">=3.10"
dependencies = [
    "minimalmodbus>=2.1.1",
    "paho-mqtt>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
waveshare-mqtt = "waveshare_mqtt.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
